    --text-3: #6A6A62;

    --success: #5CB87A;
    --success-bg: #1A2E22;
    --input-bg: #252528;
    --input-border: #3A3A3E;
    --input-focus: #6BA3E0;
    --dropdown-hover: #2A2A2E;
    --preview-bg: #111113;
    --preview-text: #D4D4D0;
    --preview-label: #7A7A72;
    --tag-bg: #1C2A3C;
    --tag-text: #6BA3E0;
  }
}
:root[data-theme="dark"] {
  --bg: #161618;
  --card: #1E1E21;
  --card-border: #2E2E32;
  --text: #E4E4E0;
  --text-2: #9A9A90;
  --text-3: #6A6A62;
  --accent: #6BA3E0;
  --accent-hover: #82B4E8;
  --accent-subtle: #1C2A3C;
  --success: #5CB87A;
  --success-bg: #1A2E22;
  --input-bg: #252528;
  --input-border: #3A3A3E;
  --input-focus: #6BA3E0;
  --dropdown-hover: #2A2A2E;
  --preview-bg: #111113;
  --preview-text: #D4D4D0;
  --preview-label: #7A7A72;
  --tag-bg: #1C2A3C;
  --tag-text: #6BA3E0;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

.wrap {
  max-width: 480px;
  margin: 0 auto;
  padding: 40px 20px 60px;
}

h1 {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-bottom: 4px;
}

.subtitle {
  font-size: 13px;
  color: var(--text-3);
  margin-bottom: 28px;
}

.card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 16px;
}

.field {
  margin-bottom: 14px;
}
.field:last-child { margin-bottom: 0; }

.field label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-2);
  margin-bottom: 5px;
  letter-spacing: 0.02em;
}

.field input, .field textarea {
  width: 100%;
  padding: 8px 10px;
  font-size: 15px;
  font-family: inherit;
  color: var(--text);
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 6px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.field input:focus, .field textarea:focus {
  border-color: var(--input-focus);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--input-focus) 15%, transparent);
}

.field textarea {
  resize: vertical;
  min-height: 38px;
  line-height: 1.4;
}

.field input::placeholder, .field textarea::placeholder {
  color: var(--text-3);
}

.model-wrap {
  position: relative;
}

.model-wrap input {
  text-transform: uppercase;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.03em;
}

.dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  margin-top: 4px;
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  max-height: 220px;
  overflow-y: auto;
  z-index: 10;
  display: none;
}

.dropdown.open { display: block; }

.dropdown .item {
  padding: 8px 12px;
  cursor: pointer;
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 14px;
  border-bottom: 1px solid var(--card-border);
}
.dropdown .item:last-child { border-bottom: none; }

.dropdown .item:hover,
.dropdown .item.active {
  background: var(--dropdown-hover);
}

.dropdown .item .code {
  font-weight: 600;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.03em;
  white-space: nowrap;
  flex-shrink: 0;
}

.dropdown .item .name {
  color: var(--text-2);
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tag {
  display: inline-block;
  background: var(--tag-bg);
  color: var(--tag-text);
  font-size: 12px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 4px;
  margin-left: 6px;
  vertical-align: middle;
}

.product-name-display {
  padding: 8px 10px;
  font-size: 15px;
  color: var(--text);
  background: var(--accent-subtle);
  border: 1px solid var(--input-border);
  border-radius: 6px;
  min-height: 36px;
  display: flex;
  align-items: center;
}

.product-name-display.empty {
  color: var(--text-3);
  font-style: italic;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.preview-section {
  margin-top: 8px;
}

.preview-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.preview-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-2);
  letter-spacing: 0.02em;
}

.copy-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  color: #fff;
  background: var(--accent);
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  user-select: none;
}

.copy-btn:hover { background: var(--accent-hover); }
.copy-btn:active { transform: scale(0.97); }

.copy-btn.copied {
  background: var(--success);
}

.preview-box {
  background: var(--preview-bg);
  border-radius: 8px;
  padding: 16px 18px;
  font-family: "SF Mono", SFMono-Regular, ui-monospace, Menlo, monospace;
  font-size: 13.5px;
  line-height: 1.65;
  color: var(--preview-text);
  white-space: pre-wrap;
  word-break: break-all;
  overflow-x: auto;
  min-height: 100px;
  position: relative;
}

.preview-box .line-label {
  color: var(--preview-label);
}

.reset-btn {
  display: block;
  width: 100%;
  padding: 10px;
  font-size: 13px;
  font-family: inherit;
  color: var(--text-3);
  background: transparent;
  border: 1px dashed var(--card-border);
  border-radius: 8px;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
  margin-top: 8px;
}
.reset-btn:hover {
  color: var(--text-2);
  border-color: var(--text-3);
}

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--success);
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  padding: 10px 20px;
  border-radius: 8px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
  z-index: 100;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>

<div class="wrap">
  <h1>轉貨需求</h1>
  <p class="subtitle">輸入型號自動帶入品名，填寫完畢後一鍵複製</p>

  <div class="card">
    <div class="field">
      <label>型號</label>
      <div class="model-wrap">
        <input type="text" id="modelInput" placeholder="輸入型號，例如 MXN63" autocomplete="off" spellcheck="false">
        <div class="dropdown" id="dropdown"></div>
      </div>
    </div>
    <div class="field">
      <label>品名 <span class="tag" id="matchTag" style="display:none">自動帶入</span></label>
      <div class="product-name-display empty" id="productName">輸入型號後自動帶入</div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div class="field">
        <label>庫存門市</label>
        <input type="text" id="fromStore" placeholder="880">
      </div>
      <div class="field">
        <label>需求門市</label>
        <input type="text" id="toStore" placeholder="75" value="75">
      </div>
    </div>
    <div class="row" style="margin-top:14px">
      <div class="field">
        <label>帳上數量</label>
        <input type="text" id="stockQty" placeholder="0" inputmode="numeric">
      </div>
      <div class="field">
        <label>需求數量</label>
        <input type="text" id="needQty" placeholder="0" inputmode="numeric">
      </div>
    </div>
    <div class="field" style="margin-top:14px">
      <label>備註</label>
      <textarea id="remark" placeholder="選填" rows="1"></textarea>
    </div>
  </div>

  <div class="preview-section">
    <div class="preview-header">
      <span class="preview-label">訊息預覽</span>
      <button class="copy-btn" id="copyBtn" onclick="copyMessage()">複製訊息</button>
    </div>
    <div class="preview-box" id="previewBox"></div>
  </div>

  <button class="reset-btn" onclick="resetForm()">清空重填</button>
</div>

<div class="toast" id="toast">已複製到剪貼簿</div>

const modelInput = document.getElementById("modelInput");
const dropdown = document.getElementById("dropdown");
const productNameEl = document.getElementById("productName");
const matchTag = document.getElementById("matchTag");
const previewBox = document.getElementById("previewBox");
const fromStore = document.getElementById("fromStore");
const toStore = document.getElementById("toStore");
const stockQty = document.getElementById("stockQty");
const needQty = document.getElementById("needQty");
const remark = document.getElementById("remark");

let selectedProduct = null;
let activeIdx = -1;
let filtered = [];

function normalize(s) {
  return s.toUpperCase().replace(/[\s\/]/g, "");
}

function search(q) {
  if (!q) return [];
  const nq = normalize(q);
  const exact = [];
  const startsWith = [];
  const contains = [];
  for (const p of P) {
    const ns = normalize(p.s);
    const base = ns.replace(/(TA|FE|ZP|PA|ZA|ZX|TE)A?$/,"");
    if (base === nq || ns === nq) { exact.push(p); continue; }
    if (base.startsWith(nq) || ns.startsWith(nq)) { startsWith.push(p); continue; }
    if (ns.includes(nq) || normalize(p.n).includes(nq)) contains.push(p);
  }
  return [...exact, ...startsWith, ...contains].slice(0, 12);
}

function renderDropdown() {
  if (filtered.length === 0) {
    dropdown.classList.remove("open");
    return;
  }
  dropdown.innerHTML = filtered.map((p, i) =>
    `<div class="item${i === activeIdx ? " active" : ""}" data-i="${i}">` +
    `<span class="code">${esc(p.s)}</span><span class="name">${esc(p.n)}</span></div>`
  ).join("");
  dropdown.classList.add("open");
  dropdown.querySelectorAll(".item").forEach(el => {
    el.addEventListener("mousedown", e => {
      e.preventDefault();
      selectProduct(filtered[+el.dataset.i]);
    });
  });
}

function esc(s) {
  const d = document.createElement("span");
  d.textContent = s;
  return d.innerHTML;
}

function selectProduct(p) {
  selectedProduct = p;
  modelInput.value = p.s;
  productNameEl.textContent = p.n;
  productNameEl.classList.remove("empty");
  matchTag.style.display = "inline-block";
  dropdown.classList.remove("open");
  activeIdx = -1;
  updatePreview();
}

modelInput.addEventListener("input", () => {
  const q = modelInput.value.trim();
  if (!q) {
    selectedProduct = null;
    productNameEl.textContent = "輸入型號後自動帶入";
    productNameEl.classList.add("empty");
    matchTag.style.display = "none";
    dropdown.classList.remove("open");
    activeIdx = -1;
    filtered = [];
    updatePreview();
    return;
  }
  filtered = search(q);
  activeIdx = -1;
  if (filtered.length === 1 && normalize(filtered[0].s).replace(/(TA|FE|ZP|PA|ZA|ZX|TE)A?$/,"") === normalize(q)) {
    selectProduct(filtered[0]);
    return;
  }
  if (selectedProduct) {
    selectedProduct = null;
    productNameEl.textContent = "輸入型號後自動帶入";
    productNameEl.classList.add("empty");
    matchTag.style.display = "none";
  }
  renderDropdown();
  updatePreview();
});

modelInput.addEventListener("keydown", e => {
  if (!dropdown.classList.contains("open")) return;
  if (e.key === "ArrowDown") {
    e.preventDefault();
    activeIdx = Math.min(activeIdx + 1, filtered.length - 1);
    renderDropdown();
    const active = dropdown.querySelector(".active");
    if (active) active.scrollIntoView({ block: "nearest" });
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    activeIdx = Math.max(activeIdx - 1, 0);
    renderDropdown();
    const active = dropdown.querySelector(".active");
    if (active) active.scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (activeIdx >= 0 && activeIdx < filtered.length) {
      selectProduct(filtered[activeIdx]);
    }
  } else if (e.key === "Escape") {
    dropdown.classList.remove("open");
    activeIdx = -1;
  }
});

modelInput.addEventListener("blur", () => {
  setTimeout(() => dropdown.classList.remove("open"), 150);
});

modelInput.addEventListener("focus", () => {
  if (filtered.length > 0 && !selectedProduct) {
    dropdown.classList.add("open");
  }
});

[fromStore, toStore, stockQty, needQty, remark].forEach(el =>
  el.addEventListener("input", updatePreview)
);

function getModelShort() {
  if (!selectedProduct) return modelInput.value.trim();
  const s = selectedProduct.s;
  return s.replace(/\s*(TA|FE|ZP|PA|ZA|ZX|TE)\/A\s*$/i, "");
}

function updatePreview() {
  const model = getModelShort() || "";
  const name = selectedProduct ? selectedProduct.n : "";
  const lines = [
    "\uFF1C轉貨需求\uFF1E",
    "庫存門市：" + fromStore.value,
    "需求門市：" + toStore.value,
    "品名：" + name,
    "型號：" + model,
    "帳上數量：" + stockQty.value,
    "需求數量：" + needQty.value,
    "備註：" + remark.value
  ];
  previewBox.textContent = lines.join("\n");
}

function copyMessage() {
  const text = previewBox.textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById("copyBtn");
    btn.classList.add("copied");
    btn.textContent = "已複製";
    const toast = document.getElementById("toast");
    toast.classList.add("show");
    setTimeout(() => {
      btn.classList.remove("copied");
      btn.textContent = "複製訊息";
      toast.classList.remove("show");
    }, 1800);
  });
}

function resetForm() {
  modelInput.value = "";
  fromStore.value = "";
  toStore.value = "75";
  stockQty.value = "";
  needQty.value = "";
  remark.value = "";
  selectedProduct = null;
  productNameEl.textContent = "輸入型號後自動帶入";
  productNameEl.classList.add("empty");
  matchTag.style.display = "none";
  dropdown.classList.remove("open");
  filtered = [];
  activeIdx = -1;
  updatePreview();
  modelInput.focus();
}

updatePreview();
</script>
